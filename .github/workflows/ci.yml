name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [catalog-service, ai-service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: ${{ matrix.component }}
      - run: python -m pytest -q
        working-directory: ${{ matrix.component }}

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
        working-directory: data

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
        working-directory: web

  python-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            catalog-service/requirements*.txt
            ai-service/requirements*.txt
      - name: Install pinned audit tooling
        run: python -m pip install pip-audit==2.9.0 cyclonedx-bom==7.1.0
      - name: Generate CycloneDX SBOMs
        run: |
          cyclonedx-py requirements catalog-service/requirements.txt --output-format JSON --output-file catalog-service.cdx.json
          cyclonedx-py requirements ai-service/requirements.txt --output-format JSON --output-file ai-service.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-sboms
          path: "*.cdx.json"
          if-no-files-found: error
      - name: Audit Python runtime dependencies
        run: |
          python -m pip_audit -r catalog-service/requirements.txt
          python -m pip_audit -r ai-service/requirements.txt

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create isolated CI environment
        shell: pwsh
        run: ./scripts/init-compose-env.ps1
      - name: Validate release preflight
        shell: pwsh
        run: ./scripts/preflight.ps1
      - name: Test production preflight policy
        shell: pwsh
        run: ./scripts/tests/preflight-production.ps1
      - name: Build production images
        run: docker compose build
      - name: Start isolated stack
        run: docker compose up -d --wait
      - name: Verify runtime and public/internal isolation
        shell: pwsh
        run: ./scripts/health-check.ps1
      - name: Show logs after a failure
        if: failure()
        run: docker compose logs --tail 200 catalog ai web
      - name: Remove isolated stack
        if: always()
        run: docker compose down -v
