name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [catalog-service, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements*.txt
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.component }}
      - run: python -m pytest -q
        working-directory: ${{ matrix.component }}

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
        working-directory: data

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
        working-directory: web

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated CI environment
        shell: pwsh
        run: ./scripts/init-compose-env.ps1
      - name: Validate release preflight
        shell: pwsh
        run: ./scripts/preflight.ps1
      - name: Build production images
        run: docker compose build
      - name: Start isolated stack
        run: docker compose up -d --wait
      - name: Verify runtime and public/internal isolation
        shell: pwsh
        run: ./scripts/health-check.ps1
      - name: Show logs after a failure
        if: failure()
        run: docker compose logs --tail 200 catalog ai web
      - name: Remove isolated stack
        if: always()
        run: docker compose down -v
