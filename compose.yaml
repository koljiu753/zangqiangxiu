name: ${COMPOSE_PROJECT_NAME:-zhixiu}

x-app-hardening: &app-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      AI_S3_ACCESS_KEY: ${AI_S3_ACCESS_KEY:?set AI_S3_ACCESS_KEY in .env}
      AI_S3_SECRET_KEY: ${AI_S3_SECRET_KEY:?set AI_S3_SECRET_KEY in .env}
      AI_S3_BUCKET: ${AI_S3_BUCKET:-zhixiu-assets}
      CATALOG_S3_ACCESS_KEY: ${CATALOG_S3_ACCESS_KEY:?set CATALOG_S3_ACCESS_KEY in .env}
      CATALOG_S3_SECRET_KEY: ${CATALOG_S3_SECRET_KEY:?set CATALOG_S3_SECRET_KEY in .env}
      CATALOG_S3_PREFIX: ${CATALOG_S3_PREFIX:-production/catalog-evidence}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$AI_S3_BUCKET"
        mc admin user add local "$$AI_S3_ACCESS_KEY" "$$AI_S3_SECRET_KEY" || mc admin user enable local "$$AI_S3_ACCESS_KEY"
        printf '%s\n' "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\",\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::$$AI_S3_BUCKET\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::$$AI_S3_BUCKET/*\"]}]}" > /tmp/zhixiu-ai-policy.json
        mc admin policy create local zhixiu-ai /tmp/zhixiu-ai-policy.json || mc admin policy info local zhixiu-ai
        mc admin policy detach local readwrite --user "$$AI_S3_ACCESS_KEY" || true
        mc admin policy attach local zhixiu-ai --user "$$AI_S3_ACCESS_KEY"
        mc admin user add local "$$CATALOG_S3_ACCESS_KEY" "$$CATALOG_S3_SECRET_KEY" || mc admin user enable local "$$CATALOG_S3_ACCESS_KEY"
        printf '%s\n' "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\"],\"Resource\":[\"arn:aws:s3:::$$AI_S3_BUCKET\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::$$AI_S3_BUCKET/$$CATALOG_S3_PREFIX/*\"]}]}" > /tmp/zhixiu-catalog-policy.json
        mc admin policy create local zhixiu-catalog /tmp/zhixiu-catalog-policy.json || mc admin policy info local zhixiu-catalog
        mc admin policy detach local readwrite --user "$$CATALOG_S3_ACCESS_KEY" || true
        mc admin policy attach local zhixiu-catalog --user "$$CATALOG_S3_ACCESS_KEY"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  catalog:
    <<: *app-hardening
    build:
      context: ./catalog-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_ENVIRONMENT: production
      CATALOG_DATABASE_BACKEND: postgresql
      CATALOG_DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      CATALOG_ADMIN_TOKEN: ${CATALOG_ADMIN_TOKEN:?set CATALOG_ADMIN_TOKEN in .env}
      CATALOG_ACTOR_SIGNING_SECRET: ${CATALOG_ACTOR_SIGNING_SECRET:?set CATALOG_ACTOR_SIGNING_SECRET in .env}
      CATALOG_CORS_ORIGINS: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}
      CATALOG_AI_INTERNAL_BASE_URL: http://ai:8002/v1
      CATALOG_AI_SERVICE_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN in .env}
      CATALOG_AI_SYNC_TIMEOUT_SECONDS: "5"
      CATALOG_S3_BUCKET: ${AI_S3_BUCKET:-zhixiu-assets}
      CATALOG_S3_ENDPOINT_URL: http://minio:9000
      CATALOG_S3_REGION: ${AI_S3_REGION:-us-east-1}
      CATALOG_S3_PREFIX: ${CATALOG_S3_PREFIX:-production/catalog-evidence}
      CATALOG_S3_ACCESS_KEY: ${CATALOG_S3_ACCESS_KEY:?set CATALOG_S3_ACCESS_KEY in .env}
      CATALOG_S3_SECRET_KEY: ${CATALOG_S3_SECRET_KEY:?set CATALOG_S3_SECRET_KEY in .env}
      CATALOG_EVIDENCE_MAX_BYTES: ${CATALOG_EVIDENCE_MAX_BYTES:-10485760}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai:
    <<: *app-hardening
    build:
      context: ./ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ZHIXIU_AI_ENVIRONMENT: ${AI_ENVIRONMENT:-development}
      ZHIXIU_AI_DATABASE_BACKEND: postgresql
      ZHIXIU_AI_DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      ZHIXIU_AI_ASSET_BACKEND: s3
      ZHIXIU_AI_DATA_DIR: /var/lib/zhixiu/ai
      ZHIXIU_AI_S3_BUCKET: ${AI_S3_BUCKET:-zhixiu-assets}
      ZHIXIU_AI_S3_ENDPOINT_URL: http://minio:9000
      ZHIXIU_AI_S3_REGION: ${AI_S3_REGION:-us-east-1}
      ZHIXIU_AI_S3_PREFIX: ${AI_S3_PREFIX:-production/ai-assets}
      ZHIXIU_AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN in .env}
      AWS_ACCESS_KEY_ID: ${AI_S3_ACCESS_KEY:?set AI_S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${AI_S3_SECRET_KEY:?set AI_S3_SECRET_KEY in .env}
      ZHIXIU_AI_CORS_ORIGINS: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ai-cache:/var/lib/zhixiu/ai/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    <<: *app-hardening
    build:
      context: ./web
      args:
        NEXT_PUBLIC_CATALOG_API_BASE_URL: ${PUBLIC_CATALOG_API_BASE_URL:-http://localhost:8001/api/v1}
        NEXT_PUBLIC_AI_API_BASE_URL: ${PUBLIC_AI_API_BASE_URL:-http://localhost:8002/v1}
        NEXT_PUBLIC_ALLOW_DEMO_FALLBACK: "false"
    restart: unless-stopped
    depends_on:
      catalog:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}
      CATALOG_API_INTERNAL_BASE_URL: http://catalog:8001/api/v1
      # Public pages must never receive draft/internal Catalog records.
      CATALOG_PREVIEW_INTERNAL: "false"
      CATALOG_ADMIN_TOKEN: ${CATALOG_ADMIN_TOKEN:?set CATALOG_ADMIN_TOKEN in .env}
      CATALOG_ACTOR_SIGNING_SECRET: ${CATALOG_ACTOR_SIGNING_SECRET:?set CATALOG_ACTOR_SIGNING_SECRET in .env}
      AI_API_INTERNAL_BASE_URL: http://ai:8002/v1
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN in .env}
      # Public Studio analyses are restricted to published reference assets.
      STUDIO_PREVIEW_INTERNAL: "false"
      ADMIN_UI_USER: ${ADMIN_UI_USER:?set ADMIN_UI_USER in .env}
      ADMIN_UI_PASSWORD: ${ADMIN_UI_PASSWORD:?set ADMIN_UI_PASSWORD in .env}
      ADMIN_UI_ROLE: publisher
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET in .env}
      AUTH_COOKIE_SECURE: "false"
      ADMIN_ALLOW_BASIC_AUTH: "false"
      # Enable only when a trusted reverse proxy overwrites X-Forwarded-For.
      ADMIN_TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
  ai-cache:
